---
- name: Install and configure Docker
  hosts: webservers
  become: true


  tasks:
    - name: Update apt package cache
      apt:
        update_cache: true


    - name: Install Docker
      apt:
        name: docker.io
        state: present


    - name: Install Docker Compose
      apt:
        name: docker-compose-v2
        state: present


    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true
