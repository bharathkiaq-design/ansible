---
- name: Install Java and Jenkins
  hosts: webservers
  become: yes


  tasks:


    - name: Update apt cache
      apt:
        update_cache: yes


    - name: Install Java dependencies
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present


    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'


    - name: Download Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'


    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins


    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes


    - name: Install Jenkins
      apt:
        name: jenkins
        state: present


    - name: Ensure Jenkins service is running
      service:
        name: jenkins
        state: started
        enabled: yes


    - name: Ensure Jenkins starts at boot
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true


    - name: Read initial Jenkins admin password
      ansible.builtin.command:
        cmd: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_initial_password
      changed_when: false


    - name: Display initial Jenkins admin password
      ansible.builtin.debug:
        msg: "{{ jenkins_initial_password.stdout }}"
